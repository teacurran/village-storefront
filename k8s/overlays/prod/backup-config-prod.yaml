---
# Production Backup Configuration
#
# Overrides base backup configuration with production environment values.
# This patch is applied via Kustomize to customize backup settings for production.

apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-config
data:
  # Production R2 endpoint (use production Cloudflare account)
  r2-endpoint: "https://account.r2.cloudflarestorage.com"

  # Production backup bucket (with cross-region replication if available)
  r2-bucket: "village-storefront-backups-prod"

  # Standard 30-day retention for production
  retention-days: "30"

  # WAL retention for point-in-time recovery (7 days = 168 hours of PITR)
  wal-retention-days: "7"

---
# Production PostgreSQL Configuration
#
# Database connection settings for production environment.

apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
data:
  # Production PostgreSQL host (managed by VillageCompute infrastructure)
  # See: villagecompute/infra/ansible/inventory/hosts.yml
  host: "10.50.0.10"

  # Standard PostgreSQL port
  port: "5432"

  # Production database name
  database: "storefront_production"

---
# Instructions for Sealed Secrets (DO NOT COMMIT REAL CREDENTIALS)
#
# CRITICAL: Production credentials MUST be managed with extra care.
#           Store in 1Password vault "VillageCompute Infrastructure"
#           under entry "village-storefront-production-backup"
#
# To create sealed secrets for production, run:
#
# 1. R2 Backup Credentials:
#    kubectl create secret generic r2-backup-credentials \
#      --namespace village-storefront-prod \
#      --from-literal=access-key-id='PROD_R2_ACCESS_KEY' \
#      --from-literal=secret-access-key='PROD_R2_SECRET_KEY' \
#      --dry-run=client -o yaml | \
#      kubeseal --controller-name sealed-secrets --controller-namespace kube-system -o yaml > sealed-secret-r2-backup.yaml
#
# 2. PostgreSQL Credentials:
#    kubectl create secret generic postgres-credentials \
#      --namespace village-storefront-prod \
#      --from-literal=username='storefront_production' \
#      --from-literal=password='PROD_DB_PASSWORD' \
#      --dry-run=client -o yaml | \
#      kubeseal --controller-name sealed-secrets --controller-namespace kube-system -o yaml > sealed-secret-postgres.yaml
#
# 3. Apply sealed secrets:
#    kubectl apply -f sealed-secret-r2-backup.yaml
#    kubectl apply -f sealed-secret-postgres.yaml
#
# 4. Verify secrets are mounted correctly:
#    kubectl get secret -n village-storefront-prod r2-backup-credentials postgres-credentials
#    kubectl logs -n village-storefront-prod -l job-name=database-backup-base --tail=50
#
# Security Notes:
# - Rotate R2 credentials quarterly
# - Backup credentials should be restricted to specific R2 bucket (IAM policy)
# - Monitor for unauthorized backup access via Cloudflare audit logs
# - Test restore procedure monthly to verify credentials are valid
