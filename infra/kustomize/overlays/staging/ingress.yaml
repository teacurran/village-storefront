---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: village-storefront-ingress
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - "*.staging.villagecompute.com"
    - "staging.villagecompute.com"
    secretName: village-storefront-staging-tls
  rules:
  - host: "*.staging.villagecompute.com"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: village-storefront-gateway
            port:
              number: 8080
  - host: "staging.villagecompute.com"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: village-storefront-gateway
            port:
              number: 8080
