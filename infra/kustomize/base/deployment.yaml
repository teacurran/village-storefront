---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: village-storefront-gateway
  labels:
    app: village-storefront
    component: gateway
    tier: frontend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0
  selector:
    matchLabels:
      app: village-storefront
      component: gateway
  template:
    metadata:
      labels:
        app: village-storefront
        component: gateway
        tier: frontend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/q/metrics"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: village-storefront

      # Pod affinity to spread gateway pods across nodes for high availability
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: component
                  operator: In
                  values:
                  - gateway
              topologyKey: kubernetes.io/hostname

      containers:
      - name: gateway
        image: ghcr.io/villagecompute/village-storefront:latest
        imagePullPolicy: IfNotPresent

        # Resource limits for HTTP request handling
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "2Gi"

        # Health checks
        livenessProbe:
          httpGet:
            path: /q/health/live
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /q/health/ready
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        # Ports
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP

        # Environment variables
        env:
        - name: QUARKUS_PROFILE
          value: "production"

        # HTTP configuration
        - name: QUARKUS_HTTP_PORT
          value: "8080"

        # Enable Quinoa SPA routing for admin dashboard
        - name: QUARKUS_QUINOA_ENABLE_SPA_ROUTING
          value: "true"

        # Database connection
        - name: QUARKUS_DATASOURCE_JDBC_URL
          valueFrom:
            secretKeyRef:
              name: village-storefront-db
              key: jdbc-url

        - name: QUARKUS_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: village-storefront-db
              key: username

        - name: QUARKUS_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: village-storefront-db
              key: password

        # Tenant resolution configuration
        - name: TENANT_RLS_ENABLED
          value: "true"

        # Metrics & observability
        - name: QUARKUS_MICROMETER_EXPORT_PROMETHEUS_ENABLED
          value: "true"

        - name: QUARKUS_LOG_LEVEL
          value: "INFO"

        - name: QUARKUS_LOG_CONSOLE_JSON
          value: "true"

        # OpenTelemetry configuration
        - name: OTEL_ENABLED
          value: "true"

        - name: OTEL_EXPORTER_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: village-storefront-config
              key: otel-endpoint
              optional: true

        # Storage client (Cloudflare R2)
        - name: R2_BUCKET_NAME
          valueFrom:
            configMapKeyRef:
              name: village-storefront-config
              key: r2-bucket-name

        - name: R2_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: village-storefront-r2
              key: access-key-id

        - name: R2_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: village-storefront-r2
              key: secret-access-key

        # Stripe API keys
        - name: STRIPE_API_KEY
          valueFrom:
            secretKeyRef:
              name: village-storefront-stripe
              key: api-key

        - name: STRIPE_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: village-storefront-stripe
              key: webhook-secret

        # Email service
        - name: QUARKUS_MAILER_HOST
          valueFrom:
            configMapKeyRef:
              name: village-storefront-config
              key: mailer-host
              optional: true

        - name: MAILER_FROM
          valueFrom:
            configMapKeyRef:
              name: village-storefront-config
              key: mailer-from
              optional: true

        # SMTP credentials (managed via sealed secrets per environment)
        - name: QUARKUS_MAILER_USERNAME
          valueFrom:
            secretKeyRef:
              name: village-storefront-mailer
              key: username
              optional: true

        - name: QUARKUS_MAILER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: village-storefront-mailer
              key: password
              optional: true

        # JVM options for container environment
        - name: JAVA_OPTS
          value: "-XX:MaxRAMPercentage=75.0 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError"

---
apiVersion: v1
kind: Service
metadata:
  name: village-storefront-gateway
  labels:
    app: village-storefront
    component: gateway
spec:
  type: ClusterIP
  selector:
    app: village-storefront
    component: gateway
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: village-storefront-gateway-hpa
  labels:
    app: village-storefront
    component: gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: village-storefront-gateway
  minReplicas: 3
  maxReplicas: 20

  metrics:
  # Scale based on CPU utilization
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

  # Scale based on memory utilization
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 3
        periodSeconds: 30
      selectPolicy: Max

    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60
      selectPolicy: Min

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: village-storefront-gateway-pdb
  labels:
    app: village-storefront
    component: gateway
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: village-storefront
      component: gateway
