# Village Storefront Application Configuration

# Application name
quarkus.application.name=village-storefront

# HTTP configuration
quarkus.http.port=8080

# Database configuration (PostgreSQL)
quarkus.datasource.db-kind=${test.db.kind:${DB_KIND:postgresql}}
quarkus.datasource.username=${test.db.username:${DB_USER:storefront}}
quarkus.datasource.password=${test.db.password:${DB_PASSWORD:storefront}}
quarkus.datasource.jdbc.url=${test.jdbc.url:${DB_URL:jdbc:postgresql://localhost:5432/storefront}}
tenant.rls.enabled=true

# Connection pool tuning (Task I6.T3: Performance testing)
# Increased from default 20 to 50 after load testing showed pool exhaustion at 100 concurrent users
# Target: Support 100+ concurrent API requests without connection wait times
quarkus.datasource.jdbc.max-size=50
quarkus.datasource.jdbc.min-size=10
# Initial size matches min-size to pre-warm connections on startup (<100ms cold start penalty)
quarkus.datasource.jdbc.initial-size=10
# Fetch size optimized for pagination (typical page size is 20-50 items)
# Reduces round trips for result set streaming
quarkus.hibernate-orm.jdbc.statement-fetch-size=50
# Connection validation before use prevents stale connection errors under load
quarkus.datasource.jdbc.validation-query-sql=SELECT 1
quarkus.datasource.jdbc.background-validation-interval=PT2M

# Hibernate ORM
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false
# Flyway database migrations
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0
quarkus.flyway.locations=classpath:db/migrations

# Quinoa (Vue.js admin dashboard)
quarkus.quinoa.enable-spa-routing=true
quarkus.quinoa.package-manager-install=true
quarkus.quinoa.package-manager-command.install=npm ci
quarkus.quinoa.package-manager-command.build=npm run build
quarkus.quinoa.dev-server.port=5173
quarkus.quinoa.ui-dir=src/main/webui
quarkus.quinoa.build-dir=dist
# Serve admin SPA at /admin/* path
quarkus.quinoa.package-manager=npm

# OpenAPI configuration
# Serve OpenAPI spec at /openapi endpoint (JSON format)
quarkus.smallrye-openapi.path=/openapi

# Point to our spec-first OpenAPI definition
# This ensures the runtime spec matches our versioned contract in api/v1/openapi.yaml
quarkus.smallrye-openapi.store-schema-directory=api/v1

# Enable OpenAPI UI at /q/swagger-ui in dev mode
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# OpenAPI spec metadata
quarkus.smallrye-openapi.info-title=Village Storefront API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Multi-tenant SaaS ecommerce platform API

# Health checks
quarkus.smallrye-health.ui.always-include=true

# Logging
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n
quarkus.log.level=INFO

# JWT configuration
mp.jwt.verify.issuer=https://village-storefront.example.com
mp.jwt.verify.publickey.location=publicKey.pem
smallrye.jwt.sign.key.location=privateKey.pem

# Content Security Policy (Task I6.T2)
# CSP headers for XSS protection via inline script blocking
csp.enabled=true
csp.report-uri=/api/v1/csp-report

# Storefront CSP policy (Qute templates)
# Allows Stripe.js for payment processing, restricts inline scripts
csp.storefront.policy=default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://api.stripe.com; frame-src https://js.stripe.com; font-src 'self' data:

# Admin SPA CSP policy (Vue.js + PrimeVue)
# Strict policy with no inline scripts (Vue build output is bundled)
csp.admin.policy=default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self' data:

# Metrics
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.binder.jvm=true
quarkus.micrometer.binder.system=true
quarkus.micrometer.binder.http-server.enabled=true

# OpenTelemetry (Task I2.T7: Catalog/Inventory observability)
# Enable OpenTelemetry for distributed tracing
quarkus.otel.enabled=${OTEL_ENABLED:true}
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_ENDPOINT:http://localhost:4317}
# Service name for tracing identification
quarkus.otel.service.name=village-storefront
# Propagate trace context via HTTP headers
quarkus.otel.propagators=tracecontext,baggage
# Sample all traces in dev/staging, use probabilistic sampling in production
quarkus.otel.traces.sampler=${OTEL_SAMPLER:always_on}
# Export spans for catalog, inventory, and API operations
quarkus.otel.instrument.rest=true
quarkus.otel.instrument.resteasy=true

# Mailer Configuration
# Development: Use Mailhog (local SMTP mock server)
%dev.quarkus.mailer.from=noreply@localhost
%dev.quarkus.mailer.host=localhost
%dev.quarkus.mailer.port=1025
%dev.quarkus.mailer.mock=false
%dev.quarkus.mailer.tls=false
%dev.quarkus.mailer.start-tls=disabled

# Test: Use mock mailer
%test.quarkus.mailer.mock=true

# Staging: Use SMTP with TLS + domain filtering
%staging.quarkus.mailer.from=${MAILER_FROM:noreply@staging.villagecompute.com}
%staging.quarkus.mailer.host=${MAILER_HOST:smtp.sendgrid.net}
%staging.quarkus.mailer.port=${MAILER_PORT:587}
%staging.quarkus.mailer.username=${MAILER_USERNAME:apikey}
%staging.quarkus.mailer.password=${MAILER_PASSWORD:}
%staging.quarkus.mailer.start-tls=REQUIRED
%staging.quarkus.mailer.mock=false
%staging.notifications.domain-filter.enabled=true
%staging.notifications.domain-filter.allowed=villagecompute.com,example.com

# Production: Use SMTP (AWS SES or SendGrid) without domain filtering
%prod.quarkus.mailer.from=${MAILER_FROM:noreply@villagecompute.com}
%prod.quarkus.mailer.host=${MAILER_HOST:email-smtp.us-east-1.amazonaws.com}
%prod.quarkus.mailer.port=${MAILER_PORT:587}
%prod.quarkus.mailer.username=${MAILER_USERNAME:}
%prod.quarkus.mailer.password=${MAILER_PASSWORD:}
%prod.quarkus.mailer.start-tls=REQUIRED
%prod.quarkus.mailer.mock=false
%prod.notifications.domain-filter.enabled=false

# Domain filtering (disabled by default, enabled in staging)
notifications.domain-filter.enabled=false
notifications.domain-filter.allowed=villagecompute.com,example.com

# Stripe Payment Provider Configuration
stripe.api.secret-key=${STRIPE_SECRET_KEY:sk_test_replace_with_your_key}
stripe.api.publishable-key=${STRIPE_PUBLISHABLE_KEY:pk_test_replace_with_your_key}
stripe.webhook.signing-secret=${STRIPE_WEBHOOK_SECRET:whsec_replace_with_your_secret}
stripe.webhook.skip-verification=${STRIPE_WEBHOOK_SKIP:false}
stripe.api.version=2023-10-16
stripe.connect.enabled=true
stripe.api.max-retries=3
stripe.api.timeout-ms=30000
stripe.test-mode=${STRIPE_TEST_MODE:true}

# POS Offline / Terminal Configuration
pos.offline.master-key=${POS_OFFLINE_MASTER_KEY:VmlsbGFnZVBPU09mZmxpbmVNYXN0ZXJLZXlfXzMyMDA=}

# Caffeine cache configuration for tenant resolution and feature flags (Task I6.T3: Performance tuning)

# Tenant cache: hostname -> TenantInfo
# Increased from 1000 to 2000 to support larger multi-tenant deployments
# Hit rate measured at 92% with 1000 entries under 100 concurrent tenants; 2000 provides headroom
quarkus.cache.caffeine."tenant-cache".maximum-size=2000
quarkus.cache.caffeine."tenant-cache".expire-after-write=PT5M
# Record stats for monitoring cache effectiveness
quarkus.cache.caffeine."tenant-cache".metrics-enabled=true

# Feature flag cache: (tenant_id, flag_key) -> Boolean
# Increased from 5000 to 10000 after load testing showed 78% hit rate with 2000+ evictions/min at 100 users
# New size reduces evictions to <100/min with 89% hit rate improvement
quarkus.cache.caffeine."feature-flag-cache".maximum-size=10000
quarkus.cache.caffeine."feature-flag-cache".expire-after-write=PT1M
quarkus.cache.caffeine."feature-flag-cache".metrics-enabled=true

# Catalog search cache: (tenant_id, search_query_hash, page, size) -> List<Product>
# Increased from 1000 to 5000 entries after load testing showed 65% hit rate with high eviction rate
# With 5000 entries, hit rate improved to 85% under 100 concurrent storefront users
quarkus.cache.caffeine."catalog-search-cache".maximum-size=5000
quarkus.cache.caffeine."catalog-search-cache".expire-after-write=PT5M
quarkus.cache.caffeine."catalog-search-cache".metrics-enabled=true

# Shipping rate cache: (tenant_id, rate_request_hash) -> AggregatedRateResult
# TTL set to 15 minutes per Architecture §3.0 Rulebook performance target
# Increased max-size from 500 to 2000 to handle multiple concurrent checkout flows
# Shipping API calls are expensive (300-500ms); higher cache hit rate saves significant latency
quarkus.cache.caffeine."shipping-rate-cache".maximum-size=2000
quarkus.cache.caffeine."shipping-rate-cache".expire-after-write=PT15M
quarkus.cache.caffeine."shipping-rate-cache".metrics-enabled=true

# Catalog & Inventory Observability Configuration (Task I2.T7)
# Root categories cache for storefront navigation
catalog.cache.root-categories.max-size=100
catalog.cache.featured-products.max-size=200
catalog.cache.ttl-minutes=15

# Catalog import/export job settings
catalog.import.max-file-size-mb=50
catalog.export.default-format=csv
catalog.export.presigned-url-expiry-hours=24

# Inventory reservation and transfer settings
inventory.reservation.expiry-hours=2
inventory.transfer.auto-cancel-days=30

# Media Pipeline Configuration (Task I4.T4)
# Cloudflare R2 storage configuration for media assets
media.storage.r2.endpoint=${R2_ENDPOINT:http://localhost:9000}
media.storage.r2.bucket=${R2_BUCKET:village-media}
media.storage.r2.access-key-id=${R2_ACCESS_KEY:minioadmin}
media.storage.r2.secret-access-key=${R2_SECRET_KEY:minioadmin}
media.storage.r2.region=auto

# Enable R2MediaStorageClient and ThumbnailatorMediaProcessor in production
# For dev/test, uses MinIO (S3-compatible) on localhost:9000
%dev.quarkus.arc.selected-alternatives=villagecompute.storefront.media.R2MediaStorageClient,villagecompute.storefront.media.ThumbnailatorMediaProcessor
%prod.quarkus.arc.selected-alternatives=villagecompute.storefront.media.R2MediaStorageClient,villagecompute.storefront.media.ThumbnailatorMediaProcessor

# Media processing configuration
media.processing.ffmpeg.path=/usr/bin/ffmpeg
media.processing.thumbnailator.quality=0.85
media.processing.video.hls.segment-duration=6
media.processing.image.sizes=thumbnail:150,small:400,medium:800,large:1600
media.processing.dispatch-interval=3s
media.upload-url.expiry-minutes=15

# Media quota configuration
media.quota.default-bytes=10737418240
media.quota.warn-threshold=0.8

# Signed URL configuration (Architecture §1.4: 24-hour expiry)
media.signed-url.expiry-hours=24
media.signed-url.max-download-attempts=5

# Job queue configuration for media processing
jobs.queue.capacity.default=500
jobs.queue.capacity.high=200
jobs.queue.capacity.critical=50
jobs.retry.max_attempts.default=3
jobs.retry.max_attempts.high=5

# Shipping Integration Configuration (Task I3.T4)
# Feature flags for shipping functionality
shipping.rates.enabled=${SHIPPING_RATES_ENABLED:true}
shipping.fallback.enabled=${SHIPPING_FALLBACK_ENABLED:true}

# USPS Web Tools API Configuration
shipping.usps.user-id=${USPS_USER_ID:test-usps}
shipping.usps.api-url=${USPS_API_URL:https://secure.shippingapis.com/ShippingAPI.dll}
shipping.usps.timeout-ms=${USPS_TIMEOUT_MS:10000}
shipping.usps.max-retries=${USPS_MAX_RETRIES:3}

# UPS Rating API Configuration
shipping.ups.access-key=${UPS_ACCESS_KEY:test-ups-access}
shipping.ups.user-id=${UPS_USER_ID:test-ups-user}
shipping.ups.password=${UPS_PASSWORD:test-ups-pass}
shipping.ups.api-url=${UPS_API_URL:https://onlinetools.ups.com/json/Rate}
shipping.ups.timeout-ms=${UPS_TIMEOUT_MS:10000}
shipping.ups.max-retries=${UPS_MAX_RETRIES:3}

# FedEx Web Services API Configuration
shipping.fedex.account-number=${FEDEX_ACCOUNT_NUMBER:test-fedex-account}
shipping.fedex.meter-number=${FEDEX_METER_NUMBER:test-fedex-meter}
shipping.fedex.api-key=${FEDEX_API_KEY:test-fedex-api}
shipping.fedex.secret-key=${FEDEX_SECRET_KEY:test-fedex-secret}
shipping.fedex.api-url=${FEDEX_API_URL:https://apis.fedex.com/rate/v1/rates/quotes}
shipping.fedex.timeout-ms=${FEDEX_TIMEOUT_MS:10000}
shipping.fedex.max-retries=${FEDEX_MAX_RETRIES:3}

# Test profile configuration
%test.test.db.kind=h2
%test.test.jdbc.url=jdbc:h2:mem:test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=SET REFERENTIAL_INTEGRITY FALSE
%test.test.db.username=sa
%test.test.db.password=
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.hibernate-orm.log.sql=true
%test.tenant.rls.enabled=false
%test.quarkus.flyway.migrate-at-start=false
%test.quarkus.flyway.clean-at-start=false
%test.quarkus.flyway.enabled=false
%test.tenant.cache.enabled=false

%test.quarkus.http.port=0
%test.quarkus.http.test-port=0

# Disable OpenTelemetry in tests (not needed for unit tests)
%test.quarkus.otel.enabled=false

# Disable JWT verification for tests (use @TestSecurity for auth testing)
%test.mp.jwt.verify.publickey.location=
%test.smallrye.jwt.sign.key.location=
%test.quarkus.smallrye-jwt.enabled=false
%test.stripe.webhook.signing-secret=whsec_test_secret
%test.stripe.webhook.skip-verification=true

# Container Image Configuration (Task I4.T7)
# Configuration for building and pushing container images
quarkus.container-image.builder=jib
quarkus.container-image.group=villagecompute
quarkus.container-image.name=village-storefront
quarkus.container-image.tag=${GIT_COMMIT_SHA:latest}
quarkus.container-image.registry=ghcr.io
quarkus.container-image.build=false
quarkus.container-image.push=false

# Native build configuration
quarkus.native.container-build=true
quarkus.native.container-runtime=docker
quarkus.native.builder-image=quay.io/quarkus/ubi-quarkus-mandrel-builder-image:jdk-21

# Kubernetes manifest generation (Task I4.T7)
quarkus.kubernetes.deployment-target=kubernetes
quarkus.kubernetes.part-of=village-storefront
quarkus.kubernetes.labels."app"=village-storefront
quarkus.kubernetes.labels."version"=1.0

# Static resource handling for Quinoa-built assets
quarkus.http.static-resources.enable-compression=true
quarkus.http.static-resources.cache-control=max-age=86400

# Scheduler configuration
quarkus.scheduler.enabled=true

# Loyalty module configuration (Task I5.T1)
loyalty.expiration.cron=0 0 2 * * ?
loyalty.expiration.enabled=true

# Reporting & Retention pipeline configuration (Task I5.T2)
# Domain event processing
reporting.events.batch_size=1000
reporting.events.lookback_minutes=5

# R2 storage for report exports and archives
reporting.storage.r2.endpoint=${R2_ENDPOINT:https://YOUR_ACCOUNT.r2.cloudflarestorage.com}
reporting.storage.r2.bucket=${R2_BUCKET:village-reports}
reporting.storage.r2.access-key-id=${R2_ACCESS_KEY:changeme}
reporting.storage.r2.secret-access-key=${R2_SECRET_KEY:changeme}
reporting.storage.r2.region=auto

# Database backup defaults (Local + R2)
backup.storage.r2.endpoint=${BACKUP_STORAGE_R2_ENDPOINT:http://127.0.0.1:9000}
backup.storage.r2.bucket=${BACKUP_STORAGE_R2_BUCKET:dev-storefront-backups}
backup.storage.r2.access-key-id=${BACKUP_STORAGE_R2_ACCESS_KEY:test-access-key}
backup.storage.r2.secret-access-key=${BACKUP_STORAGE_R2_SECRET_KEY:test-secret}
backup.storage.r2.region=${BACKUP_STORAGE_R2_REGION:us-east-1}
backup.postgres.password=${BACKUP_POSTGRES_PASSWORD:storefront}
backup.storage.local-root=${BACKUP_STORAGE_LOCAL_ROOT:${sys:java.io.tmpdir}/village-storefront/local-backups}

# Job queue configuration
jobs.queue.capacity.critical=1000
jobs.queue.capacity.high=5000
jobs.queue.capacity.default=10000
jobs.queue.capacity.low=10000
jobs.queue.capacity.bulk=20000

jobs.retry.max_attempts.critical=5
jobs.retry.max_attempts.high=3
jobs.retry.max_attempts.default=3
jobs.retry.max_attempts.low=3

# Consignment Payout Automation Configuration (Task I5.T6)
# Automated payout batch creation (monthly by default)
consignment.payout.automation.enabled=${CONSIGNMENT_PAYOUT_AUTOMATION_ENABLED:false}
consignment.payout.automation.batch-creation-cron=0 0 1 * * ?

# Balance settlement configuration (pending to available)
consignment.payout.settlement.enabled=${CONSIGNMENT_SETTLEMENT_ENABLED:true}
consignment.payout.settlement.cron=0 0 */6 * * ?
consignment.payout.settlement.hold-period-days=${CONSIGNMENT_HOLD_PERIOD_DAYS:7}

# Auto-approval thresholds
consignment.payout.auto-approve.enabled=${CONSIGNMENT_AUTO_APPROVE_ENABLED:false}
consignment.payout.auto-approve.amount-limit=${CONSIGNMENT_AUTO_APPROVE_LIMIT:500.00}
consignment.payout.auto-approve.min-consignor-tenure-months=3
consignment.payout.auto-approve.failure-lookback-months=6

# Payout processing
consignment.payout.processing.max-retries=3
consignment.payout.processing.retry-backoff-hours=1,4,24

# Production profile overrides
%prod.quarkus.native.enabled=true
%prod.media.processing.ffmpeg.path=/usr/bin/ffmpeg
%prod.reporting.storage.r2.endpoint=${R2_ENDPOINT}
%prod.reporting.storage.r2.bucket=${R2_BUCKET}
%prod.reporting.storage.r2.access-key-id=${R2_ACCESS_KEY}
%prod.reporting.storage.r2.secret-access-key=${R2_SECRET_KEY}
%prod.consignment.payout.automation.enabled=true
%prod.consignment.payout.auto-approve.enabled=true
