{#if price}
<div class="flex items-baseline gap-2 {className}">
    {#if compareAtPrice && compareAtPrice != price}
    <!-- Sale pricing -->
    <span class="text-{size ?: '2xl'} font-bold text-error-600">
        {price}
    </span>
    <span class="text-{smallSize ?: 'sm'} text-neutral-500 line-through">
        {compareAtPrice}
    </span>
    {#if savingsPercent}
    <span class="text-{smallSize ?: 'xs'} font-medium text-error-600 bg-error-50 px-2 py-0.5 rounded">
        Save {savingsPercent}%
    </span>
    {/if}
    {#else}
    <!-- Regular pricing -->
    <span class="text-{size ?: '2xl'} font-bold text-neutral-900">
        {price}
    </span>
    {/if}
    {#if subscriptionInterval}
    <span class="text-{smallSize ?: 'sm'} text-neutral-600">
        / {subscriptionInterval}
    </span>
    {/if}
</div>
{/if}
