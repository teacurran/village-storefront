{#if tier && tier.name}
<div class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-semibold bg-gradient-to-r {tier.gradient ?: 'from-primary-500 to-secondary-500'} text-white shadow-soft">
    {#if tier.icon}
    <span class="text-sm" role="img" aria-label="{tier.name} tier">{tier.icon}</span>
    {/if}
    <span>{tier.name}</span>
    {#if pointsToNext && pointsToNext > 0}
    <span class="opacity-90 text-xxs">· {pointsToNext} {msg.points_to_next_tier}</span>
    {/if}
</div>
{/if}
