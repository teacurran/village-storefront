          description: Orders retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderListResponse"
        "400":
          description: Invalid status filter
          content:
            application/json: {}
        "500":
          description: Internal server error
          content:
            application/json: {}
