          content:
            application/json: {}
  /api/v1/payments/intents:
    post:
      summary: Create payment intent
      description: |
        Creates a Stripe payment intent with platform fee calculation and metadata.
        Returns client secret for use with Stripe.js or mobile SDKs.

        **Idempotency:** Supply Idempotency-Key header to safely retry requests.
        **Feature Flags:** Respects `payments.stripe.enabled` kill switch.
        **Authentication:** Requires valid session or guest checkout token.
      operationId: createPaymentIntent
      tags:
      - Payments
      parameters:
      - description: Idempotency key ensuring safe retries
        required: false
        name: Idempotency-Key
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentIntentRequest"
        required: true
      responses:
        "201":
          description: Payment intent created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntentResponse"
        "400":
          description: Invalid request parameters
          content:
            application/json: {}
        "409":
          description: Idempotency key conflict - different request body with same
            key
          content:
            application/json: {}
        "500":
          description: Payment provider error
          content:
            application/json: {}
  /api/v1/payments/intents/{id}:
    get:
      summary: Get payment intent details
      description: |
        Retrieves payment intent details by local ID.

        **Authorization:** Requires admin or order owner permissions.
      operationId: getPaymentIntent
      tags:
      - Payments
      parameters:
      - description: Payment intent ID
        required: true
        name: id
        in: path
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Payment intent found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntentResponse"
        "404":
          description: Payment intent not found
          content:
            application/json: {}
  /api/v1/payments/intents/{id}/capture:
    post:
      summary: Capture authorized payment
      description: |
        Captures a payment intent that was created with manual capture mode.
        Used for delayed capture flows (e.g., after fulfillment).

        **Authorization:** Requires admin or order owner permissions.
        **Feature Flags:** Respects `payments.stripe.enabled` kill switch.
      operationId: capturePayment
      tags:
      - Payments
      parameters:
      - description: Payment intent ID
        required: true
        name: id
        in: path
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CapturePaymentRequest"
        required: true
      responses:
        "200":
          description: Payment captured successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntentResponse"
        "400":
          description: Payment not in authorized state
          content:
            application/json: {}
        "404":
          description: Payment intent not found
          content:
            application/json: {}
        "500":
          description: Payment provider error
          content:
            application/json: {}
  /api/v1/payments/intents/{id}/refund:
    post:
      summary: Refund captured payment
      description: |
        Refunds a captured payment, either fully or partially.
        Automatically handles consignment commission reversals.

        **Authorization:** Requires admin permissions.
        **Feature Flags:** Respects `payments.stripe.enabled` kill switch.
        **Side Effects:** Triggers order refund workflow and consignment adjustments.
      operationId: refundPayment
      tags:
      - Payments
      parameters:
      - description: Payment intent ID
        required: true
        name: id
        in: path
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefundPaymentRequest"
        required: true
      responses:
        "200":
          description: Refund processed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntentResponse"
        "400":
          description: Payment not in captured state or invalid amount
          content:
            application/json: {}
        "404":
          description: Payment intent not found
          content:
            application/json: {}
        "500":
          description: Payment provider error
          content:
            application/json: {}
