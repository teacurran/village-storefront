        minRedemptionPoints:
          type: integer
          format: int32
          minimum: 1
        maxRedemptionPoints:
          type: integer
          format: int32
        pointsExpirationDays:
          type: integer
          format: int32
        tiers:
          type: array
          items:
            $ref: "#/components/schemas/LoyaltyTierConfigRequest"
          minItems: 1
        metadata:
          type: object
          additionalProperties: {}
