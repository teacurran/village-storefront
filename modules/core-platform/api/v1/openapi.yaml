          type: integer
          format: int32
      - description: Items per page (max 100)
        example: 20
        name: pageSize
        in: query
        schema:
          type: integer
          format: int32
      - description: Filter by order status
        example: shipped
        name: status
        in: query
        schema:
          type: string
      responses:
